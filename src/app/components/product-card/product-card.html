<article class="card" [class.out-of-stock]="product().stock === 0" [appLowStock]="product().stock">
  <img [src]="product().imageUrl" [alt]="product().name" />

  @switch (product().category) {
    @case ("Informatique") { <p class="badge">GEEK</p> }
    @case ("Audio") { <p class="badge">STYLER</p> }
  }

  <h3>{{ product().name | titlecase }}</h3>
  <p class="category">{{ product().category }}</p>
  <p class="price">{{ product().price | currency: 'EUR' }}</p>
  <p class="stock">{{ product().stock | stockLabel }}</p>

  @if (product().stock > 0) {
    <app-quantity-picker [(quantity)]="quantity" [max]="product().stock" />
  }

  <button (click)="onAddToCart(product())" [disabled]="product().stock === 0">
    Ajouter au panier
  </button>
</article>
