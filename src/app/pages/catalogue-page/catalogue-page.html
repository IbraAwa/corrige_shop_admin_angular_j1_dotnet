<h2>Catalogue</h2>
<p>Articles dans le panier : {{ cartCount() }}</p>

<br/>

<div class="wrapper">
  @for (product of products(); track product.id) {
    @if(product.category === categoryChoice() || categoryChoice().length < 4) {
      <app-product-card [product]="product" (addToCart)="addToCart($event)" />
    }
  } @empty {
    <p> Je n'ai pas de produit dans mon catalogue</p>
  }
</div>
